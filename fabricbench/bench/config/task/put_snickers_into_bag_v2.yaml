name: put_snickers_into_bag_v2
task_class: "fabricbench.bench.task.task_put_snickers_into_bag_v2:PutSnickersIntoBagV2Task"
task_description: "pick the snickers on table into the bag"

robot: piper
cloth: "bag/nonwoven_small_6"
planner: toppra
# PD needed — snickers is a free rigid body; only SolverMuJoCo contact forces
# can hold it (kinematic mode has none and the bar slips out).
control_mode: pd
translation_preconditioner: true
render: isaac_render

max_steps: 400

# Free rigid objects injected into the newton scene (freejoint + box collider
# from the asset's collision_obj; renderer injects the asset's usd and tracks
# the body xform). pos/quat override the asset_meta default_pos/default_quat.
# Bar position (0.50,-0.35) matches deformable_bench's scene XML. Geometry
# matters: the horizontal-grasp quat closes the fingers perpendicular to the
# base->target direction, which at this spot is ~perpendicular to the bar's
# long axis (x). Closer positions (e.g. 0.30,-0.15) make the pinch oblique
# (~27°) and the bar wedges out of the fingers lengthwise.
rigid_objects:
  - asset: object/snickers
    pos: [0.50, -0.35, -0.010]
    quat: [0.5, 0.5, -0.5, -0.5]

task_params:
  # ============================================================
  # Snickers segment — single-arm pick & drop into bag mouth.
  # Numbers aligned with config/task/pack_snicker_v2.yaml's snickers segment.
  # mouth_xy/mouth_z 自动从 cloth 顶层顶点 (排除 strap tip) 推导 — 跟着 base_pos 走.
  # 如果发现 transport 高度/进袋深度不对, 调下面的 above_mouth_offset / descend_offset.
  # ============================================================
  snickers_arm: right
  snickers_body_name: snickers_body

  snickers_grasp_close_val:     0.0
  snickers_grasp_height_offset: -0.018
  snickers_grasp_z:             0.005

  # 中转高度: 提到 mouth 之上的 transit 高度. 0.35 比 0.45 保守 ~10cm,
  # 避免右臂跨中线 + 高 z 同时打满工作空间触发 IK 不可解.
  snickers_lift_z:            0.35
  snickers_above_mouth_offset: 0.10
  snickers_descend_offset:     0.05

  # mouth_xy 自动从袋身顶点 (body_indices, 排除 strap tip) 推导.
  # 如果想往某个方向偏 (e.g. 离 strap 远点更好抓), 加 dx/dy. 默认 0,0 = 不偏.
  snickers_mouth_dx: 0.0
  snickers_mouth_dy: 0.0

  snickers_release_val:    1.0

  snickers_move_to_grasp_velocity_scale: 0.15
  snickers_close_duration:               0.4
  snickers_close_settle_time:            0.1
  snickers_transport_velocity_scale:    [0.2, 0.1]
  snickers_transport_settle_time:        0.3
  snickers_descend_velocity_scale:       0.4
  snickers_descend_settle_time:          0.3
  snickers_release_duration:             0.6
  snickers_release_settle_time:          0.0

  # 成功判定 (独立, 仅看士力架是否落进去):
  #   xy 距离 mouth_xy < snickers_success_xy_radius
  #   AND
  #   snickers z < mouth_z - snickers_success_z_below_mouth
  snickers_success_xy_radius:    0.12
  snickers_success_z_below_mouth: 0.02

cloth_config:
  backend: direct_obj
  stretch_stiff: [10000, 10000, 10000]
  bend_stiff: [203670e-9, 203670e-9, 203670e-9]
  density: 1.2
  thickness: 0.001
  friction: 0.6
  ground_static_friction: 0.5
  ground_dynamic_friction: 0.3
  gripper_static_friction: 10.0
  gripper_dynamic_friction: 10.0

# Runtime-tuned cloth physics. Top-level physics is what TaskSpec.scene_config()
# reads; cloth_config above is legacy deformable_bench-style documentation.
physics:
  density: 1.2
  particle_radius: 0.003
  tri_ka: 500.0
  tri_kd: 1.0e-4
  tri_aniso_ke: [10000.0, 10000.0, 10000.0]
  edge_aniso_ke: [2.0367e-4, 2.0367e-4, 2.0367e-4]
  edge_kd: 1.0e-4
  soft_contact_margin: 0.002
  soft_contact_ke: 50.0
  soft_contact_kd: 0.1
  soft_contact_mu: 0.6
  solver_iterations: 10
  linear_iterations: 10
  style3d_self_collision: true
  style3d_collision_radius: 0.0005
  style3d_collision_stiff_vf: 0.01
  style3d_collision_stiff_ee: 0.005
  style3d_collision_stiff_ef: 0.05

contact_materials:
  default_shape_mu: 0.5
  gripper_shape_mu: 10.0

eval:
  sim_duration: 12.0
  check_interval: 1.0
  success_check:
    type: custom   # delegate to PutSnickersIntoBagV2Task.check_success

randomization:
  seed: 42

  cloth_init:
    target_body_name: cloth
    base_pos:  [0.40, 0.00, 0.0]
    base_quat: [1.0, 0.0, 0.0, 0.0]
    pos_offset: {enabled: true, range_x: [-0.02, 0.02], range_y: [-0.02, 0.02]}
    rot_offset: {enabled: true, axis_z_only: true, angle_range_deg: [-5, 5]}
    wrinkled: {enabled: false}
    settle_duration: 1.5
    sampling: random

  robot_init:
    start_pose: lift_silk
    noise_scale: 0.5       # 关键: noise 不要太大, 否则 home_q 偏离 IK seed 收敛.

  light:
    enabled: false

  # 士力架默认位置: XML 里写死 [0.30, -0.15, -0.0123]. 想换默认位置改 XML.
  # 这里只能给位置/朝向 offset.
  rigid_init:
    snickers_body:
      pos_offset:
        enabled: true
        range_x: [-0.05, 0.05]
        range_y: [-0.05, 0.05]
        range_z: [0.0, 0.0]
      yaw_offset:
        enabled: false
        range_deg: [-15, 15]

# grasp_bag_strap_v4 -- production config for the widened, symmetric randomization.
#
# What changed vs grasp_bag_strap.yaml, and why (measured 2026-08-07/08):
#  * aim_yaw_from_strap: the shipped targets track the bag's PLACEMENT but not its
#    YAW -- a fixed +-|dy| about the bag origin swings the straps out from under
#    the aim by r*sin(yaw), r ~ 0.13 m (measured: -2.31 mm/deg, r = -0.993). The
#    +-5 deg shipped range alone is +-11 mm, wider than the jaw's capture window,
#    and it cost 4 of 11 episodes. Reading the yaw off the two strap-mid centroids
#    and turning the targets with it fixes that. strap_yaw_rest_deg = this asset's
#    reading at zero rotation (+3.53 deg, constant to 0.05 deg over 6 episodes).
#  * the box: x nominal moved OUT to 0.43 so +-3 cm is symmetric without pulling
#    the bag toward the robot -- joint5 sits on its +-69.9 deg stop at PRE, and
#    x = -2 cm combined with +-15 deg yaw fails 3 of 4 corners. y stays +-2 cm
#    (centred on 0): +y has room to +4 cm, but -y is capped by the right hand's
#    constant ~15 mm aim bias, so +-2 cm is the largest SYMMETRIC range that holds.
#
# Verified: 8/8 randomized episodes in this box, plus its corners
# (x 0.40/0.46 x y -2/+4 x yaw +-15) -- see data/eval_out/gripper_penetration/bagff/.

name: grasp_bag_strap_v4
task_class: "fabricbench.bench.task.task_grasp_bag_strap:BagStrapGraspTask"
task_description: "grasp the strap of the bag and lift it"

robot: piper
cloth: "bag/nonwoven_small_6"
planner: toppra
# Grasping the (cloth) strap — kinematic, same as grasp_silk / fling.
control_mode: kinematic
translation_preconditioner: true
render: isaac_render

max_steps: 200

# Values verbatim from deformable_bench config/task/grasp_bag_strap_single_v4.yaml.
task_params:
  # world-frame target offsets (Δ from bag base_pos; |Δy| mirrored L/R, y ref =
  # cloth centroid at runtime)
  pre_offset_xyz:   [0.080, 0.278, 0.205]
  grasp_offset_xyz: [0.095, 0.120, 0.198]

  lift_height: 0.45

  # Strap grasp is derived from the live strap-mid centroid (see task).
  pre_approach_dz: 0.06
  left_dy:  0.0
  right_dy: 0.0
  left_dz:  0.0
  right_dz: 0.0

  # aim follows the bag's measured yaw (see task file _measured_bag_yaw)
  aim_yaw_from_strap: true
  strap_yaw_rest_deg: 3.53

  open_gripper_value:  1.0
  close_gripper_value: 0.01

  home_to_pre_velocity_scale:  0.40
  pre_to_grasp_velocity_scale: 0.15
  lift_velocity_scale:         0.20
  return_home_velocity_scale:  0.40

  bag_settle_duration: 1.0
  pre_settle:          0.0
  grasp_settle:        0.8
  close_duration:      1.0
  post_close_settle:   0.5
  lift_settle:         1.0
  return_home_settle:  0.5

  # success: both straps' tip+mid mean z > strap_lift_thresh AND bag centroid z
  # rose > bag_lift_thresh from post-settle baseline.
  strap_lift_thresh:   0.35
  bag_lift_thresh:     0.05

# Drape symmetry comes from the builder's OBJ-origin cloth anchoring (matches
# deformable). Moderate stretch stiffening (4000 vs the soft asset default 1000,
# still below deformable's 10000): both straps lift, but the very soft bag
# stretches so the body centroid rises just under bag_lift_thresh — a firmer bag
# transmits the lift to the body without stiffening the strap out of grip range.
physics:
  tri_aniso_ke: [8000.0, 8000.0, 8000.0]
  density: 0.3
  particle_radius: 0.003
  tri_ka: 500.0
  tri_kd: 1.0e-4
  edge_aniso_ke: [1.0e-5, 1.0e-5, 1.0e-5]
  edge_kd: 1.0e-4
  soft_contact_margin: 0.0015
  soft_contact_ke: 50.0
  soft_contact_kd: 0.1
  soft_contact_mu: 0.2
  solver_iterations: 10
  linear_iterations: 10
  style3d_self_collision: false
  style3d_collision_radius: 0.0005
  style3d_collision_stiff_vf: 0.01
  style3d_collision_stiff_ee: 0.005
  style3d_collision_stiff_ef: 0.05

contact_materials:
  gripper_shape_mu: 5.0

eval:
  sim_duration: 10.0
  check_interval: 1.0
  success_check:
    type: custom   # delegate to BagStrapGraspTask.check_success

randomization:
  seed: 43   # collection seed. 42 is eval_sim's default -- grasp_bag_strap_v3
             # ate it from this yaml and its eval could only be scored SEEN
             # (EXPERIMENT-LOG §2). Convention: data 0/43, eval 42.

  cloth_init:
    base_pos: [0.43, 0.00, 0.0]
    base_quat: [1.0, 0.0, 0.0, 0.0]
    pos_offset: {enabled: true, range_x: [-0.03, 0.03], range_y: [-0.02, 0.02]}
    rot_offset: {enabled: true, axis_z_only: true, angle_range_deg: [-15, 15]}
    settle_duration: 1.0

  robot_init:
    start_pose: lift_silk
    noise_scale: 0.5

  light:
    enabled: false
